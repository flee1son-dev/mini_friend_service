services:

  db:
    image: postgres:16

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 5s

      timeout: 5s

      retries: 10

    container_name: mini_friend_service_db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  backend:
    build: ./backend

    container_name: friend_service_fastapi_backend

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"
    
    volumes:
      - ./backend:/backend

    working_dir: /backend
    
    env_file:
      - .env

    command: >
      sh -c "
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
  
  migrator:
    build: ./backend
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
