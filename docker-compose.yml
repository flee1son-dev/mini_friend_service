services:
  db:
    image: postgres:16
    container_name: mini_friend_service_db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: friend_service_fastapi_backend

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./:/app

    working_dir: /app

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    command: >
      sh -c "uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile

    working_dir: /app

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    depends_on:
      db:
        condition: service_healthy

    command: alembic upgrade head

volumes:
  postgres_data: